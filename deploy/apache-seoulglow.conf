# Apache — reverse proxy a Next.js (Seoul Glow)
#
# Instalación:
#   sudo cp deploy/apache-seoulglow.conf /etc/apache2/sites-available/seoulglow.conf
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo a2ensite seoulglow
#   sudo a2dissite 000-default
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Next.js escucha SOLO en 127.0.0.1:3000 (servicio seoulglow.service).

<VirtualHost *:80>
    ServerName seoulglow.local
    ServerAlias 192.168.1.232

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    RequestHeader set X-Forwarded-Proto "http"

    <Proxy *>
        Require all granted
    </Proxy>

    ErrorLog  ${APACHE_LOG_DIR}/seoulglow_error.log
    CustomLog ${APACHE_LOG_DIR}/seoulglow_access.log combined
</VirtualHost>
